name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave empty to publish 1.1.0)"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="1.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing version: $VERSION"

      - name: Discover packable projects
        id: projects
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t projects < <(find src -mindepth 2 -maxdepth 2 -name '*.csproj' ! -path '*/samples/*' | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "No projects found."
            exit 1
          fi

          packable_projects=()
          test_projects=()
          for project in "${projects[@]}"; do
            if grep -Eq '<IsTestProject>\s*true\s*</IsTestProject>' "$project"; then
              test_projects+=("$project")
            else
              packable_projects+=("$project")
            fi
          done

          if [ "${#packable_projects[@]}" -eq 0 ]; then
            echo "No packable projects found."
            exit 1
          fi

          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo "No test projects found."
            exit 1
          fi

          printf '%s\n' "${packable_projects[@]}" > packable-projects.txt
          printf '%s\n' "${test_projects[@]}" > test-projects.txt
          echo "Packable projects:"
          printf ' - %s\n' "${packable_projects[@]}"
          echo "Test projects:"
          printf ' - %s\n' "${test_projects[@]}"

      - name: Restore packable projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet restore "$project"
          done < packable-projects.txt

      - name: Build packable projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet build "$project" -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          done < packable-projects.txt

      - name: Restore tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet restore "$project"
          done < test-projects.txt

      - name: Build tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet build "$project" -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          done < test-projects.txt

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet test "$project" -c Release --no-build --verbosity normal
          done < test-projects.txt

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            dotnet pack "$project" -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}
          done < packable-projects.txt

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
